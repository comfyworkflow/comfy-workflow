# Models manifest for Comfy Workflow Benchmark V1.
# Schema version 1 — additive evolution per DA-011.
schema_version: 1

# YouTube video URLs — single source of truth (point 5 of self-explanatory
# bats sub-tarefa). Read by:
#   - update_workflow_links.py  → .md sidecar body
#   - inject_markdown.py        → Format B Note body
#   - generate_install_scripts.py → ERROR/SUCCESS blocks in install .bat
#
# CLI flags on update_workflow_links.py write to this section and then
# auto-chain inject_markdown + generate_install_scripts so all three
# audience-facing surfaces stay in lockstep with the published URLs.
# Empty string => the surface renders "(Coming soon — watch the repo
# for updates)" in place of the URL.
videos:
  install_base: "https://youtu.be/PZmJqxP5ajs"
  install_sdxl: "https://youtu.be/sC7cwc-mocw"
  install_flux1: "https://youtu.be/Q2affrqIS7U"
  install_qwen_image: "https://youtu.be/5Scqu_PGhgM"
  install_qwen_2512: ""
  install_hunyuan_21: "https://youtu.be/hxTeL8S4m2g"
  install_wan22: ""
  install_hidream_i1: "https://youtu.be/tP_3YbEX8hA"
  install_z_image: "https://youtu.be/ALEDES9IkOs"
  pillar_1: "https://youtu.be/sC7cwc-mocw"
  pillar_2: "https://youtu.be/Q2affrqIS7U"
  pillar_3: "https://youtu.be/5Scqu_PGhgM"
  pillar_4: "https://youtu.be/hxTeL8S4m2g"
  pillar_5: "https://youtu.be/tP_3YbEX8hA"
  pillar_6: "https://youtu.be/ALEDES9IkOs"

