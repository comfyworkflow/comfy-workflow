[project]
name = "comfy-workflow"
version = "0.1.0"
description = "Benchmark suite for ComfyUI workflows across consumer GPUs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    {name = "Rafael Bueno"},
]
keywords = ["comfyui", "benchmark", "ai", "gpu", "stable-diffusion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    # GPU + system inspection
    "pynvml>=11.5.0",
    "psutil>=6.0.0",
    "pywin32>=308; sys_platform == 'win32'",

    # YAML configs
    "pyyaml>=6.0.2",

    # HTTP requests (ComfyUI API + downloads)
    "requests>=2.32.0",

    # Imagens pra smoke + verify
    "pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/comfyworkflow/comfy-workflow"
Repository = "https://github.com/comfyworkflow/comfy-workflow"
Issues = "https://github.com/comfyworkflow/comfy-workflow/issues"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pynvml.*", "wmi.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--strict-markers"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
